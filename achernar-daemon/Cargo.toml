[package]
name = "achernar-daemon"
version = "0.1.0"
edition = "2021"
authors = ["Achernar Team"]
description = "Astronomy imaging and control daemon with hardware interfacing"

[[bin]]
name = "achernar-daemon"
path = "src/main.rs"

[dependencies]
# Async Runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Web Server & API
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }

# WebSocket & Streaming
tokio-tungstenite = "0.21"
futures = "0.3"
ureq = "3.1.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }

# Configuration
config = "0.14"

# Cross-platform Serial Communication
serialport = "4"

# Cross-platform USB Access
rusb = "0.9"

# Image Processing
image = "0.24"
ndarray = "0.15"

# AI/ML
ort = { version = "2.0.0-rc.9", features = ["download-binaries"] }

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error Handling
anyhow = "1"
thiserror = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"
parking_lot = "0.12"

# Linux-only dependencies (INDI protocol, Video4Linux)
[target.'cfg(target_os = "linux")'.dependencies]
# INDI client - only on Linux where INDI servers typically run
# Using git dependency since crates.io version may be outdated
#indi = { git = "https://github.com/twinkle-astronomy/indi.git", optional = true }
#v4l = "0.14"

# Windows-only dependencies (ASCOM Alpaca for telescope/camera control)
[target.'cfg(target_os = "windows")'.dependencies]
# ASCOM Alpaca client for Windows astronomy hardware
ascom-alpaca = { version = "1.0.0-beta.6", optional = true }

[features]
# Optional features for hardware support
default = []
#indi-support = ["indi"]
ascom-support = ["ascom-alpaca"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
