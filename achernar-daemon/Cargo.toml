[package]
name = "achernar-daemon"
version = "0.1.0"
edition = "2021"
authors = ["Achernar Team"]
description = "Astronomy imaging and control daemon with hardware interfacing"

[[bin]]
name = "achernar-daemon"
path = "src/main.rs"

[dependencies]
# Async Runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Web Server & API
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }

# WebSocket & Streaming
tokio-tungstenite = "0.21"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }

# Astronomy Hardware - CRITICAL
indi = "0.2"           # INDI protocol client
serialport = "4"       # Serial mount control
rusb = "0.9"           # Raw USB access for cameras

# Image Processing
image = "0.24"
ndarray = "0.15"

# AI/ML
ort = { version = "1.16", features = ["download-binaries"] }  # ONNX Runtime

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error Handling
anyhow = "1"
thiserror = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"  # Video4Linux for webcams

[target.'cfg(target_os = "windows")'.dependencies]
# Windows-specific astronomy drivers if needed
# ascom-alpaca crate doesn't exist yet, placeholder for future

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
