services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: achernar_postgres
    environment:
      POSTGRES_DB: achernar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: achernar_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: achernar_backend
    command: daphne -b 0.0.0.0 -p 8000 backend.asgi:application
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/achernar
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=backend.settings
      - ACHERNAR_RELAY_DEV_TOKEN=achernar-dev-token
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: achernar_celery
    command: celery -A backend worker -l info
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/achernar
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=backend.settings
    depends_on:
      redis:
        condition: service_healthy

  daemon:
    build:
      context: ./achernar-daemon
      dockerfile: Dockerfile
    container_name: achernar_daemon
    ports:
      - "3030:3030"
    environment:
      - ACHERNAR_PORT=3030
      - ACHERNAR_HOST=0.0.0.0
      - ACHERNAR_CLOUD_HTTP=http://backend:8000
      - ACHERNAR_CLOUD_WS=ws://backend:8000
      - ACHERNAR_RELAY_DEV_TOKEN=achernar-dev-token
      - ACHERNAR_HARDWARE_ID=achernar-docker-daemon
      - RUST_LOG=info
    volumes:
      - ./achernar-daemon/config:/app/config:ro

  web:
    image: node:20
    container_name: achernar_web
    working_dir: /app/achernar-frontend
    command: sh -c "corepack enable && pnpm install && pnpm dev --host"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/packages/ui/node_modules
      - /app/achernar-frontend/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_DAEMON_URL=http://localhost:3030/api/v1
      - VITE_CLOUD_API=http://localhost:8000/api

volumes:
  postgres_data:
