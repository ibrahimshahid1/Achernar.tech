services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: achernar_postgres
    environment:
      POSTGRES_DB: achernar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: achernar_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: achernar_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: achernar
      MINIO_ROOT_PASSWORD: achernar-dev-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: achernar_backend
    command: daphne -b 0.0.0.0 -p 8000 backend.asgi:application
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/achernar
      - REDIS_URL=redis://redis:6379/0
      - AWS_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=achernar
      - AWS_SECRET_ACCESS_KEY=achernar-dev-password
      - ACHERNAR_FRAME_BUCKET=achernar-frames
      - ACHERNAR_MODEL_BUCKET=achernar-models
      - DJANGO_SETTINGS_MODULE=backend.settings
      - ACHERNAR_RELAY_DEV_TOKEN=achernar-dev-token
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  daemon:
    build:
      context: ./achernar-daemon
      dockerfile: Dockerfile
    container_name: achernar_daemon
    ports:
      - "3030:3030"
    environment:
      - ACHERNAR_PORT=3030
      - ACHERNAR_HOST=0.0.0.0
      - ACHERNAR_CLOUD_HTTP=http://backend:8000
      - ACHERNAR_CLOUD_WS=ws://backend:8000
      - ACHERNAR_RELAY_DEV_TOKEN=achernar-dev-token
      - ACHERNAR_HARDWARE_ID=achernar-docker-daemon
      - RUST_LOG=info
    volumes:
      - ./achernar-daemon/config:/app/config:ro

  web:
    image: node:20
    container_name: achernar_web
    working_dir: /app/achernar-frontend
    command: sh -c "corepack enable && pnpm install && pnpm dev --host"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/packages/ui/node_modules
      - /app/achernar-frontend/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_DAEMON_URL=http://localhost:3030/api/v1
      - VITE_CLOUD_API=http://localhost:8000/api
      - VITE_HARDWARE_TRANSPORT=django

volumes:
  postgres_data:
  minio_data:
