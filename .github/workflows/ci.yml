name: Achernar CI

# Gating jobs (frontend typecheck, Django check, daemon fmt + cargo check) fail
# the build on real regressions — they are intentionally NOT suffixed with
# "|| true". Advisory jobs (clippy, lint, ML imports, desktop check) report
# problems without blocking merges.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend: TypeScript typecheck (GATING) ─────────────────
  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm (Corepack)
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      # Install the whole workspace so the "workspace:*" links resolve.
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      # GATING: strict typecheck. Catches broken imports, the kind of
      # split-brain/orphaned-module regressions this gate exists to prevent.
      - name: TypeScript typecheck (web)
        run: pnpm -C achernar-frontend exec tsc --noEmit -p tsconfig.app.json

      - name: Lint (advisory)
        run: pnpm -C achernar-frontend run lint
        continue-on-error: true

      - name: Production build (advisory)
        run: pnpm -C achernar-frontend run build
        continue-on-error: true

  # ── Backend: Django system check (GATING) ───────────────────
  backend:
    name: Django — system check
    runs-on: ubuntu-latest
    env:
      USE_SQLITE: "1"
      DJANGO_SETTINGS_MODULE: backend.settings
      # Provide a Redis URL only if you also start a Redis service; left unset
      # so the check exercises the LocMemCache fallback branch.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements/*.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # GATING: settings must import and the project must pass system checks.
      - name: Django system check
        run: python manage.py check

      - name: Migrations are up to date (advisory)
        run: python manage.py makemigrations --check --dry-run
        continue-on-error: true

  # ── Daemon: Rust fmt + cargo check (GATING) ─────────────────
  daemon:
    name: Daemon — fmt & cargo check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: achernar-daemon
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # OLS C++ bridge needs OpenCV + libtiff (see ols-bridge/CMakeLists.txt);
      # rusb needs libusb; serialport needs libudev. Vendor camera SDKs are not
      # tracked in git (sdks/ is gitignored), so those drivers auto-disable.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ pkg-config \
            libopencv-dev libtiff-dev \
            libusb-1.0-0-dev libudev-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            achernar-daemon/target
          key: ${{ runner.os }}-cargo-daemon-${{ hashFiles('achernar-daemon/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-daemon-

      # GATING: formatting (fast, deterministic).
      - name: cargo fmt --check
        run: cargo fmt --all --check

      # GATING: compiles the Rust crate AND the C++ FFI bridge via build.rs.
      - name: cargo check
        run: cargo check

      - name: cargo clippy (advisory)
        run: cargo clippy -- -D warnings
        continue-on-error: true

  # ── Desktop: Tauri shell cargo check (advisory) ─────────────
  desktop:
    name: Desktop — cargo check
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: achernar-desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      # Tauri 2 Linux build prerequisites.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # tauri-build verifies frontendDist exists, so provide a placeholder so a
      # source-only check does not fail on a missing build output.
      - name: Provide placeholder frontend dist
        run: mkdir -p ../../achernar-frontend/dist && echo "<!doctype html>" > ../../achernar-frontend/dist/index.html

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo check
        run: cargo check

  # ── ML: import smoke test (advisory) ────────────────────────
  ml:
    name: ML — import check
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check model imports
        run: |
          python -c "
          import importlib, sys, os
          os.chdir('..'); sys.path.insert(0, '.')
          errors = []
          for mod in [
              'ml.models.focus_quality_cnn',
              'ml.models.focus_offset_mlp',
              'ml.models.focus_offset_lgbm',
              'ml.models.focus_drift_kalman',
              'ml.models.cloud_classifier',
              'ml.models.trailing_cnn',
              'ml.models.tri_modal_embedding',
              'ml.models.exposure_bandit',
              'ml.models.filter_recommender',
          ]:
              try:
                  importlib.import_module(mod); print(f'  ok {mod}')
              except Exception as e:
                  errors.append(f'{mod}: {e}'); print(f'  FAIL {mod}: {e}')
          print(f'{len(errors)} import errors (advisory)')
          "
