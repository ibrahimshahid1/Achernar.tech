name: Achernar CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ── Rust Daemon ─────────────────────────────────────────────
  rust-check:
    name: Rust — cargo check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: achernar-daemon
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libusb-1.0-0-dev libudev-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            achernar-daemon/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('achernar-daemon/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo check
        run: cargo check --workspace 2>&1 || true
        # NOTE: FFI bridge may fail without full OLS headers.
        # This is expected until the C++ bridge is vendored.

      - name: cargo clippy (advisory)
        run: cargo clippy --workspace -- -D warnings 2>&1 || true
        continue-on-error: true

  # ── Django Backend ──────────────────────────────────────────
  django-check:
    name: Django — system check
    runs-on: ubuntu-latest
    env:
      USE_SQLITE: "1"
      DJANGO_SETTINGS_MODULE: backend.settings
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements/*.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check --deploy 2>&1 || python manage.py check

      - name: Django migrations check
        run: python manage.py makemigrations --check --dry-run 2>&1 || true

  # ── Frontend TypeScript ─────────────────────────────────────
  frontend-check:
    name: Frontend — TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: achernar-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: TypeScript type check
        run: npx tsc --noEmit 2>&1 || true

      - name: Build check
        run: npm run build 2>&1 || true

  # ── ML Training ────────────────────────────────────────────
  ml-check:
    name: ML — import check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check model imports
        run: |
          python -c "
          import importlib, sys, os
          os.chdir('..')
          sys.path.insert(0, '.')
          errors = []
          for mod in [
              'ml.models.focus_quality_cnn',
              'ml.models.focus_offset_mlp',
              'ml.models.focus_offset_lgbm',
              'ml.models.focus_drift_kalman',
              'ml.models.cloud_classifier',
              'ml.models.trailing_cnn',
              'ml.models.tri_modal_embedding',
              'ml.models.exposure_bandit',
              'ml.models.filter_recommender',
          ]:
              try:
                  importlib.import_module(mod)
                  print(f'  ✓ {mod}')
              except Exception as e:
                  errors.append(f'{mod}: {e}')
                  print(f'  ✗ {mod}: {e}')
          if errors:
              print(f'\n{len(errors)} import errors (non-fatal)')
          "
